<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" role="img" aria-label="Pierre Brunelle — Co-Founder &amp; CEO at Pixeltable">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="nodeActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <radialGradient id="glowIndigo" cx="72%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#cbd5e1" stroke-width="0.6" stroke-opacity="0.65"/>
    </pattern>

    <pattern id="majorGrid" width="96" height="96" patternUnits="userSpaceOnUse">
      <rect width="96" height="96" fill="url(#grid)"/>
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-opacity="0.45"/>
    </pattern>

    <path id="laneTop" d="M 608 156 C 632 156, 634 102, 658 102" fill="none"/>
    <path id="laneMid" d="M 608 156 L 658 156" fill="none"/>
    <path id="laneBot" d="M 608 156 C 632 156, 634 210, 658 210" fill="none"/>
    <path id="laneOutTop" d="M 796 102 C 816 102, 818 156, 836 156" fill="none"/>
    <path id="laneOutMid" d="M 796 156 L 836 156" fill="none"/>
    <path id="laneOutBot" d="M 796 210 C 816 210, 818 156, 836 156" fill="none"/>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .pulse { animation: pulseOp 2.4s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 5 5; animation: dashFlow 1.6s linear infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseOp { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.35; } }
      @keyframes dashFlow { to { stroke-dashoffset: -20; } }
    </style>
  </defs>

  <!-- Outer Frame & Blueprint Grid -->
  <rect width="960" height="320" rx="14" fill="url(#bgGrad)"/>
  <rect width="960" height="320" rx="14" fill="url(#majorGrid)"/>
  <rect width="960" height="320" rx="14" fill="url(#glowIndigo)"/>
  <rect x="0.75" y="0.75" width="958.5" height="318.5" rx="13.25" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Accent Line -->
  <rect x="28" y="0" width="904" height="2.5" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Blueprint Coordinates / Telemetry Header -->
  <g class="mono" font-size="10.5" fill="#475569">
    <text x="32" y="28">$ whoami --profile pierrebrunelle</text>
    <rect x="242" y="18" width="6" height="12" fill="#4f46e5" class="cursor"/>
    <text x="928" y="28" text-anchor="end">47.6062° N, 122.3321° W // SEATTLE, WA</text>
  </g>
  <line x1="32" y1="38" x2="928" y2="38" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ================= LEFT COLUMN: IDENTITY & ARCHITECTURE ================= -->
  <g transform="translate(32, 68)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="276" height="24" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2"/>
    <circle cx="14" cy="12" r="4" fill="#059669" class="pulse"/>
    <text x="26" y="16" class="mono" font-size="10.5" fill="#1e293b" font-weight="600">CO-FOUNDER &amp; CEO</text>
    <text x="138" y="16" class="mono" font-size="10.5" fill="#4f46e5" font-weight="700">@pixeltable</text>
    <!-- PXT-VERSION:START --><text x="216" y="16" class="mono" font-size="10" fill="#64748b">v0.7.21</text><!-- PXT-VERSION:END -->

    <!-- Name -->
    <text x="0" y="64" class="sans" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.8">Pierre Brunelle</text>

    <!-- Subtitle / Thesis -->
    <text x="0" y="92" class="sans" font-size="14.5" font-weight="500" fill="#334155">
      Building the backend agents build with —
    </text>
    <text x="0" y="112" class="sans" font-size="14.5" font-weight="500" fill="#475569">
      multimodal data, declarative compute &amp; serving in <tspan class="mono" fill="#0284c7" font-weight="600" font-size="13.5">app.py</tspan>.
    </text>

    <!-- Career Trajectory Chips -->
    <g transform="translate(0, 134)" class="mono" font-size="10.5">
      <rect x="0" y="0" width="96" height="24" rx="5" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
      <text x="48" y="15.5" text-anchor="middle" fill="#312e81" font-weight="700">Pixeltable</text>

      <text x="105" y="15.5" fill="#64748b">←</text>

      <rect x="118" y="0" width="168" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="202" y="15.5" text-anchor="middle" fill="#334155">Noteable <tspan fill="#64748b">(acq. Confluent)</tspan></text>

      <text x="295" y="15.5" fill="#64748b">←</text>

      <rect x="308" y="0" width="154" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="385" y="15.5" text-anchor="middle" fill="#334155">AWS · Amazon · Siemens</text>
    </g>

    <!-- Engineering Roots Footer -->
    <g transform="translate(0, 178)" class="mono" font-size="11">
      <text x="0" y="14" fill="#64748b">DISCIPLINES //</text>
      <text x="98" y="14" fill="#0f172a" font-weight="600">AI Data Infrastructure</text>
      <text x="248" y="14" fill="#94a3b8">·</text>
      <text x="258" y="14" fill="#475569">Decision Science</text>
      <text x="368" y="14" fill="#94a3b8">·</text>
      <text x="378" y="14" fill="#475569">Structural Eng</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: LIVE PIPELINE TERMINAL ================= -->
  <g transform="translate(508, 54)">
    <!-- Terminal Window Card -->
    <rect x="0" y="0" width="420" height="218" rx="10" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.25"/>
    <rect x="0" y="0" width="420" height="28" rx="10" fill="#f1f5f9"/>
    <line x1="0" y1="28" x2="420" y2="28" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="14" cy="14" r="4.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="28" cy="14" r="4.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="42" cy="14" r="4.5" fill="#10b981" opacity="0.85"/>
    <text x="210" y="18" text-anchor="middle" class="mono" font-size="10.5" fill="#334155" font-weight="600">app.py — Declarative Multimodal Pipeline</text>
  </g>

  <!-- Connector Paths -->
  <use href="#laneTop" stroke="#cbd5e1" stroke-width="1.5"/>
  <use href="#laneMid" stroke="#cbd5e1" stroke-width="1.5"/>
  <use href="#laneBot" stroke="#cbd5e1" stroke-width="1.5"/>
  <use href="#laneOutTop" stroke="#cbd5e1" stroke-width="1.5"/>
  <use href="#laneOutMid" stroke="#cbd5e1" stroke-width="1.5"/>
  <use href="#laneOutBot" stroke="#cbd5e1" stroke-width="1.5"/>

  <use href="#laneTop" stroke="#4f46e5" stroke-width="1.5" class="flow-line" opacity="0.65"/>
  <use href="#laneMid" stroke="#0891b2" stroke-width="1.5" class="flow-line" opacity="0.65"/>
  <use href="#laneBot" stroke="#7c3aed" stroke-width="1.5" class="flow-line" opacity="0.65"/>
  <use href="#laneOutTop" stroke="#4f46e5" stroke-width="1.5" class="flow-line" opacity="0.65"/>
  <use href="#laneOutMid" stroke="#0891b2" stroke-width="1.5" class="flow-line" opacity="0.65"/>
  <use href="#laneOutBot" stroke="#7c3aed" stroke-width="1.5" class="flow-line" opacity="0.65"/>

  <!-- Animated Data Packets -->
  <circle r="3.2" fill="#4f46e5">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 608 156 C 632 156, 634 102, 658 102"/>
  </circle>
  <circle r="3.2" fill="#0891b2">
    <animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite" path="M 608 156 L 658 156"/>
  </circle>
  <circle r="3.2" fill="#7c3aed">
    <animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite" path="M 608 156 C 632 156, 634 210, 658 210"/>
  </circle>
  <circle r="3.2" fill="#059669">
    <animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" path="M 796 156 L 836 156"/>
  </circle>

  <!-- Node 1: TableModel Ingest -->
  <g transform="translate(522, 126)">
    <rect x="0" y="0" width="86" height="60" rx="7" fill="url(#nodeActiveGrad)" stroke="#4f46e5" stroke-width="1.2"/>
    <text x="43" y="20" text-anchor="middle" class="mono" font-size="10" fill="#312e81" font-weight="700">TableModel</text>
    <text x="43" y="35" text-anchor="middle" class="mono" font-size="8.5" fill="#475569">Video · Image</text>
    <text x="43" y="48" text-anchor="middle" class="mono" font-size="8.5" fill="#475569">Audio · Docs</text>
  </g>

  <!-- Node 2A: Computed Columns & UDFs -->
  <g transform="translate(658, 82)">
    <rect x="0" y="0" width="138" height="40" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" fill="#3730a3" font-weight="600">@pxt.udf / Compute</text>
    <text x="10" y="30" class="mono" font-size="8.5" fill="#64748b">Incremental DAG</text>
  </g>

  <!-- Node 2B: EmbeddingIndex -->
  <g transform="translate(658, 136)">
    <rect x="0" y="0" width="138" height="40" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" fill="#155e75" font-weight="600">EmbeddingIndex</text>
    <text x="10" y="30" class="mono" font-size="8.5" fill="#64748b">.similarity() recall</text>
  </g>

  <!-- Node 2C: Tool Calling & Memory -->
  <g transform="translate(658, 190)">
    <rect x="0" y="0" width="138" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" fill="#5b21b6" font-weight="600">invoke_tools()</text>
    <text x="10" y="30" class="mono" font-size="8.5" fill="#64748b">Agent Memory &amp; LLM</text>
  </g>

  <!-- Node 3: FastAPIRouter Serving -->
  <g transform="translate(836, 126)">
    <rect x="0" y="0" width="78" height="60" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
    <text x="39" y="20" text-anchor="middle" class="mono" font-size="9.5" fill="#065f46" font-weight="700">FastAPI</text>
    <text x="39" y="35" text-anchor="middle" class="mono" font-size="8.5" fill="#475569">pxt service</text>
    <text x="39" y="48" text-anchor="middle" class="mono" font-size="8.5" fill="#059669" font-weight="600">pxt://cloud</text>
  </g>

  <!-- Terminal Footer Command Bar -->
  <g transform="translate(522, 248)" class="mono" font-size="9.5">
    <text x="0" y="11" fill="#059669" font-weight="700">➜</text>
    <text x="14" y="11" fill="#334155">pxt schema update app.py &amp;&amp; pxt service update app.py -f</text>
    <text x="392" y="11" text-anchor="end" fill="#0284c7" font-weight="600">200 OK</text>
  </g>

  <!-- Bottom Status Bar -->
  <line x1="32" y1="286" x2="928" y2="286" stroke="#cbd5e1" stroke-width="1"/>
  <g class="mono" font-size="10.5" fill="#475569">
    <text x="32" y="304">STACK // Python · PostgreSQL · FastAPI · Kubernetes · Multimodal AI · MCP</text>
    <!-- PXT-TELEMETRY:START --><text x="928" y="304" text-anchor="end">★ 1,648 STARS · 39 RUNNABLE APPS · APACHE-2.0</text><!-- PXT-TELEMETRY:END -->
  </g>
</svg>
